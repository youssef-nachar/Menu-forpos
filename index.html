<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو المخبز - طلب جديد</title>
    <!-- Google Fonts: Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzA0XPVzn7dZYYKbqjoWD4XoH2MEHxq_s",
            authDomain: "pos-system-b20e2.firebaseapp.com",
            databaseURL: "https://pos-system-b20e2-default-rtdb.firebaseio.com",
            projectId: "pos-system-b20e2",
            storageBucket: "pos-system-b20e2.firebasestorage.app",
            messagingSenderId: "709615712934",
            appId: "1:709615712934:web:2a06fe3e6aa1630fe69267",
            measurementId: "G-9CFD4RBYH2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.dbRefs = { ref, onValue, push };
    </script>

    <style>
        :root {
            --primary-amber: #d97706;
            --primary-hover: #b45309;
            --primary-light: #fffbeb;
            --gradient-gold: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --bg-main: #f8fafc;
            --surface-card: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 28px;
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 4px 10px -2px rgba(0, 0, 0, 0.02);
            --shadow-float: 0 20px 35px -10px rgba(15, 23, 42, 0.25);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 120px;
            min-height: 100vh;
        }

        /* SVG Styles */
        .icon-svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: inline-block;
            vertical-align: middle;
        }

        /* Layout Container */
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        .main-content {
            width: 100%;
        }

        /* Header UI */
        header {
            position: relative;
            background: var(--gradient-gold);
            color: white;
            padding: 32px 20px 26px;
            border-radius: var(--radius-lg);
            text-align: center;
            box-shadow: 0 14px 28px -8px rgba(217, 119, 6, 0.35);
            margin-bottom: 20px;
            overflow: hidden;
        }

        header::after {
            content: "🥐";
            position: absolute;
            left: -15px;
            bottom: -25px;
            font-size: 100px;
            opacity: 0.15;
            transform: rotate(15deg);
            pointer-events: none;
        }

        header h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            font-size: 13.5px;
            opacity: 0.95;
            margin-top: 6px;
            font-weight: 500;
        }

        /* Active Session Tag */
        .session-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 8px;
            font-weight: 700;
        }

        /* Order Type Selector Tabs */
        .order-type-tabs {
            display: flex;
            background: #e2e8f0;
            padding: 4px;
            border-radius: 14px;
            margin-bottom: 14px;
            gap: 4px;
        }

        .type-tab {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-sub);
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .type-tab.active {
            background: white;
            color: var(--primary-amber);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        /* Order Inputs Area */
        .order-inputs {
            background: var(--surface-card);
            padding: 18px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid rgba(226, 232, 240, 0.6);
        }

        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .input-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field .icon-svg {
            position: absolute;
            right: 14px;
            color: var(--primary-amber);
        }

        .input-field input {
            width: 100%;
            padding: 12px 42px 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: var(--radius-sm);
            font-size: 13.5px;
            outline: none;
            transition: all 0.2s ease;
            background: #f8fafc;
            color: var(--text-main);
        }

        .input-field input:focus {
            border-color: var(--primary-amber);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15);
        }

        /* Search Bar */
        .search-box {
            position: relative;
            margin-bottom: 16px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 38px 12px 14px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
            font-size: 13.5px;
            outline: none;
            background: #ffffff;
        }

        .search-box .icon-svg {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }

        /* Products Grid */
        .grid-header {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-main);
        }

        .grid-header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .card {
            background: var(--surface-card);
            border-radius: var(--radius-md);
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-card);
            position: relative;
            transition: all 0.2s ease;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -5px rgba(0, 0, 0, 0.08);
        }

        .card:active {
            transform: scale(0.97);
        }

        .card .emoji {
            font-size: 48px;
            margin-bottom: 8px;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.08));
        }

        .card h3 {
            font-size: 14.5px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 4px;
            text-align: center;
        }

        .card .price {
            color: var(--primary-amber);
            font-weight: 900;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .add-btn {
            width: 100%;
            background: var(--primary-light);
            color: var(--primary-amber);
            border: 1px solid rgba(217, 119, 6, 0.2);
            padding: 9px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .add-btn:hover, .add-btn:active {
            background: var(--primary-amber);
            color: white;
            border-color: var(--primary-amber);
        }

        /* Floating Bottom Tray Bar (Mobile) */
        .floating-tray-bar {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            max-width: 468px;
            margin: 0 auto;
            background: #0f172a;
            color: white;
            padding: 14px 20px;
            border-radius: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-float);
            z-index: 99;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .floating-tray-bar:active {
            transform: scale(0.98);
        }

        .tray-bar-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge-count {
            background: var(--primary-amber);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 13.5px;
        }

        .tray-bar-price {
            font-weight: 800;
            font-size: 17px;
            color: #fbbf24;
        }

        /* Drawer Overlay */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .drawer-overlay.active {
            display: block;
            opacity: 1;
        }

        .drawer-content {
            position: fixed;
            bottom: -100%;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 22px;
            z-index: 101;
            transition: bottom 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .drawer-overlay.active .drawer-content {
            bottom: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid #f1f5f9;
        }

        .drawer-header h3 {
            font-size: 17px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-btn {
            background: #f1f5f9;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drawer-items {
            overflow-y: auto;
            margin: 16px 0;
            max-height: 250px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .drawer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid #f1f5f9;
        }

        .qty-picker {
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
            padding: 4px 10px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        .qty-picker button {
            border: none;
            background: none;
            color: var(--primary-amber);
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            width: 20px;
        }

        .send-order-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-green-hover));
            color: white;
            border: none;
            padding: 15px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.28);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .send-order-btn:disabled {
            background: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #0f172a;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 13.5px;
            font-weight: 700;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 200;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Order Log Section */
        .sent-orders-section {
            margin-top: 28px;
            background: white;
            border-radius: var(--radius-md);
            padding: 18px;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(226, 232, 240, 0.6);
        }

        .sent-card {
            background: #f8fafc;
            border-right: 4px solid var(--accent-green);
            padding: 12px 14px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 13px;
        }

        .clear-history-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .new-bill-btn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Skeleton Loading */
        .skeleton-card {
            height: 170px;
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: var(--radius-md);
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Spinner animation */
        .spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* RESPONSIVE MEDIA QUERIES */
        @media (min-width: 640px) {
            .inputs-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 1024px) {
            body {
                padding-bottom: 40px;
            }
            .app-container {
                grid-template-columns: 1fr 380px;
            }
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .floating-tray-bar {
                display: none !important;
            }
            .drawer-overlay {
                display: block !important;
                position: static;
                background: transparent;
                backdrop-filter: none;
                opacity: 1;
                z-index: 1;
            }
            .drawer-content {
                position: sticky;
                top: 24px;
                bottom: auto;
                max-width: 100%;
                border-radius: var(--radius-md);
                box-shadow: var(--shadow-card);
                border: 1px solid rgba(226, 232, 240, 0.8);
                max-height: calc(100vh - 48px);
            }
            .close-btn {
                display: none;
            }
            .desktop-orders-log {
                display: block;
            }
            .mobile-orders-log {
                display: none;
            }
        }

        @media (min-width: 1280px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>

<body>

    <div class="toast" id="toast">
        <svg class="icon-svg" style="color: var(--accent-green);" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        <span>تمت الإضافة للسلة ✨</span>
    </div>

    <div class="app-container">
        <!-- Main Content Area -->
        <main class="main-content">
            <header>
                <h1>🥐 مخبز البركة الفاخر</h1>
                <p>اختر ما تشتهي وتابع طلبك خطوة بخطوة</p>
                <div class="session-badge" id="sessionBadge">رقم الجلسة: جارٍ الإنشاء...</div>
            </header>

            <!-- Order Input Form -->
            <div class="order-inputs">
                <!-- Order Type Toggle Tabs -->
                <div class="order-type-tabs">
                    <button class="type-tab active" id="tabDineIn" onclick="switchOrderType('dine_in')">
                        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
                        داخل المحل
                    </button>
                    <button class="type-tab" id="tabDelivery" onclick="switchOrderType('delivery')">
                        <svg class="icon-svg" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                        توصيل / خارج المحل
                    </button>
                </div>

                <div class="inputs-grid">
                    <!-- Dine-In Field -->
                    <div class="input-field" id="fieldTable">
                        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v3"></path><path d="M2 11v3a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"></path><path d="M4 16v4"></path><path d="M20 16v4"></path></svg>
                        <input type="text" id="custTable" placeholder="رقم الطاولة أو اسم الزبون" oninput="saveInputsState()">
                    </div>

                    <!-- Delivery Fields -->
                    <div class="input-field" id="fieldPhone" style="display: none;">
                        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        <input type="tel" id="custPhone" placeholder="رقم الهاتف للتواصل *" oninput="saveInputsState()">
                    </div>

                    <div class="input-field" id="fieldAddress" style="display: none; grid-column: 1 / -1;">
                        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        <input type="text" id="custAddress" placeholder="العنوان التفصيلي (المنطقة، الشارع، البناية) *" oninput="saveInputsState()">
                    </div>

                    <!-- Common Field -->
                    <div class="input-field" id="fieldNote" style="grid-column: 1 / -1;">
                        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <input type="text" id="custNote" placeholder="أي ملاحظات خاصة بالطلب؟" oninput="saveInputsState()">
                    </div>
                </div>
            </div>

            <div class="grid-header">
                <div class="grid-header-title">
                    <svg class="icon-svg" style="color: var(--primary-amber)" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"></path><path d="M12 6v6l4 2"></path></svg>
                    القائمة المتاحة
                </div>
            </div>

            <!-- Search Bar -->
            <div class="search-box">
                <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="بحث عن صنف..." oninput="filterMenu()">
            </div>
            
            <div class="grid" id="menuGrid">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>

            <!-- Active Orders Log (Mobile Only) -->
            <div class="sent-orders-section mobile-orders-log" id="myOrdersContainerMobile" style="display: none;">
                <div class="grid-header" style="margin-bottom: 4px;">
                    <div class="grid-header-title">
                        <svg class="icon-svg" style="color: var(--accent-green)" viewBox="0 0 24 24"><path d="M3 3v5h5"></path><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"></path><path d="M12 7v5l4 2"></path></svg>
                        طلباتك السابقة
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button class="new-bill-btn" onclick="startNewSession()">
                            <svg class="icon-svg" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            فاتورة جديدة
                        </button>
                        <button class="clear-history-btn" onclick="clearSentOrdersHistory()">
                            <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            مسح السجل
                        </button>
                    </div>
                </div>
                <div id="sentOrdersListMobile"></div>
            </div>
        </main>

        <!-- Sidebar Area (Desktop Basket / Mobile Drawer) -->
        <aside class="sidebar-area">
            <div class="drawer-overlay" id="drawerOverlay" onclick="handleOverlayClick(event)">
                <div class="drawer-content" onclick="event.stopPropagation()">
                    <div class="drawer-header">
                        <h3>
                            <svg class="icon-svg" style="color:var(--primary-amber);" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                            سلة الطلبات
                        </h3>
                        <button class="close-btn" onclick="toggleDrawer(false)">
                            <svg class="icon-svg" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>

                    <div class="drawer-items" id="drawerList"></div>

                    <div style="display:flex; justify-content:space-between; font-weight:800; font-size:16px; margin-bottom:16px;">
                        <span>المجموع الكلي:</span>
                        <span id="drawerTotal" style="color: var(--primary-amber);">$0.00</span>
                    </div>

                    <button class="send-order-btn" id="sendOrderBtn" onclick="sendOrder()">
                        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        تأكيد وإرسال الطلب
                    </button>

                    <!-- Active Orders Log (Desktop Side Panel) -->
                    <div class="sent-orders-section desktop-orders-log" id="myOrdersContainerDesktop" style="display: none; margin-top: 20px;">
                        <div class="grid-header" style="margin-bottom: 4px;">
                            <div class="grid-header-title">
                                <svg class="icon-svg" style="color: var(--accent-green)" viewBox="0 0 24 24"><path d="M3 3v5h5"></path><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"></path><path d="M12 7v5l4 2"></path></svg>
                                طلباتك السابقة
                            </div>
                            <div style="display:flex; gap:6px;">
                                <button class="new-bill-btn" onclick="startNewSession()">
                                    <svg class="icon-svg" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                    جديدة
                                </button>
                                <button class="clear-history-btn" onclick="clearSentOrdersHistory()">
                                    <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                </button>
                            </div>
                        </div>
                        <div id="sentOrdersListDesktop"></div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Floating Bottom Bar (Mobile Only) -->
    <div class="floating-tray-bar" id="trayBar" onclick="toggleDrawer(true)" style="display: none;">
        <div class="tray-bar-info">
            <div class="badge-count" id="barBadge">0</div>
            <span style="font-size: 14px; font-weight:700;">عرض السلة</span>
        </div>
        <div class="tray-bar-price" id="barTotal">$0.00</div>
    </div>

    <script>
        let products = [];
        let tray = [];
        let sentOrders = [];
        let currentOrderType = 'dine_in';
        let currentSessionId = "";

        function initSessionId() {
            let existingId = localStorage.getItem("current_session_id");
            if (!existingId) {
                existingId = "REQ-" + Math.floor(1000 + Math.random() * 9000);
                localStorage.setItem("current_session_id", existingId);
            }
            currentSessionId = existingId;
            document.getElementById("sessionBadge").innerText = "رقم الفاتورة: " + currentSessionId;
        }

        function startNewSession() {
            let newId = "REQ-" + Math.floor(1000 + Math.random() * 9000);
            localStorage.setItem("current_session_id", newId);
            currentSessionId = newId;
            document.getElementById("sessionBadge").innerText = "رقم الفاتورة: " + currentSessionId;
            sentOrders = [];
            localStorage.removeItem("my_sent_orders");
            renderSentOrders();
        }

        function switchOrderType(type) {
            currentOrderType = type;
            const tabDineIn = document.getElementById("tabDineIn");
            const tabDelivery = document.getElementById("tabDelivery");
            
            const fieldTable = document.getElementById("fieldTable");
            const fieldPhone = document.getElementById("fieldPhone");
            const fieldAddress = document.getElementById("fieldAddress");

            if (type === 'dine_in') {
                tabDineIn.classList.add("active");
                tabDelivery.classList.remove("active");

                fieldTable.style.display = "flex";
                fieldPhone.style.display = "none";
                fieldAddress.style.display = "none";
            } else {
                tabDelivery.classList.add("active");
                tabDineIn.classList.remove("active");

                fieldTable.style.display = "none";
                fieldPhone.style.display = "flex";
                fieldAddress.style.display = "flex";
            }
            saveInputsState();
        }

        function loadFromLocalStorage() {
            try {
                initSessionId();

                const storedOrders = localStorage.getItem("my_sent_orders");
                if (storedOrders) {
                    sentOrders = JSON.parse(storedOrders);
                    renderSentOrders();
                }

                const storedTray = localStorage.getItem("my_tray");
                if (storedTray) {
                    tray = JSON.parse(storedTray);
                    renderTray();
                }

                const storedType = localStorage.getItem("order_type");
                if (storedType) switchOrderType(storedType);

                const storedTable = localStorage.getItem("cust_table");
                const storedPhone = localStorage.getItem("cust_phone");
                const storedAddress = localStorage.getItem("cust_address");
                const storedNote = localStorage.getItem("cust_note");

                if (storedTable) document.getElementById("custTable").value = storedTable;
                if (storedPhone) document.getElementById("custPhone").value = storedPhone;
                if (storedAddress) document.getElementById("custAddress").value = storedAddress;
                if (storedNote) document.getElementById("custNote").value = storedNote;
            } catch (e) {
                console.error("Local Storage Error:", e);
            }
        }

        function saveInputsState() {
            localStorage.setItem("order_type", currentOrderType);
            localStorage.setItem("cust_table", document.getElementById("custTable").value);
            localStorage.setItem("cust_phone", document.getElementById("custPhone").value);
            localStorage.setItem("cust_address", document.getElementById("custAddress").value);
            localStorage.setItem("cust_note", document.getElementById("custNote").value);
        }

        function initMenuFirebase() {
            if (!window.db) { setTimeout(initMenuFirebase, 100); return; }
            const { ref, onValue } = window.dbRefs;

            onValue(ref(window.db, 'products'), (snapshot) => {
                const data = snapshot.val();
                products = data ? Object.values(data) : [];
                renderMenu(products);
            });

            // مراقبة حذف الطلبات من الكاشير لتفريغ شاشة المنيو وبدء جلسة جديدة
            onValue(ref(window.db, 'requests'), (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    if (sentOrders.length > 0) {
                        startNewSession();
                    }
                    return;
                }
                const currentRequests = Object.values(data);
                const hasMySession = currentRequests.some(r => (r.id === currentSessionId || r.table === currentSessionId));
                if (!hasMySession && sentOrders.length > 0) {
                    startNewSession();
                }
            });
        }

        function renderMenu(items) {
            const grid = document.getElementById("menuGrid");
            grid.innerHTML = "";

            if (!items || items.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8;">لا توجد أصناف متاحة حالياً</div>`;
                return;
            }

            items.forEach((p) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="emoji">${p.emoji || '🥖'}</div>
                    <h3>${p.name}</h3>
                    <div class="price">$${Number(p.price || 0).toFixed(2)}</div>
                    <button class="add-btn">
                        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        إضافة
                    </button>
                `;
                card.querySelector('.add-btn').addEventListener('click', () => addToTray(p));
                grid.appendChild(card);
            });
        }

        function filterMenu() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query));
            renderMenu(filtered);
        }

        function showToast() {
            const t = document.getElementById("toast");
            t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 1800);
        }

        function addToTray(prod) {
            let item = tray.find(i => i.name === prod.name);
            if (item) {
                item.qty++;
            } else {
                tray.push({ name: prod.name, price: Number(prod.price) || 0, cost: Number(prod.cost) || 0, qty: 1 });
            }

            localStorage.setItem("my_tray", JSON.stringify(tray));
            showToast();
            renderTray();
        }

        function updateQty(index, delta) {
            tray[index].qty += delta;
            if (tray[index].qty <= 0) tray.splice(index, 1);
            
            localStorage.setItem("my_tray", JSON.stringify(tray));
            renderTray();
            if (tray.length === 0 && window.innerWidth < 1024) toggleDrawer(false);
        }

        function renderTray() {
            const bar = document.getElementById("trayBar");
            const drawerList = document.getElementById("drawerList");
            let total = 0;
            let count = 0;

            if (tray.length === 0) {
                bar.style.display = "none";
                drawerList.innerHTML = `<div style="text-align:center; padding: 20px; color: #94a3b8; font-size: 13.5px;">السلة فارغة حالياً</div>`;
                document.getElementById("barBadge").innerText = 0;
                document.getElementById("barTotal").innerText = "$0.00";
                document.getElementById("drawerTotal").innerText = "$0.00";
                return;
            }

            bar.style.display = "flex";
            drawerList.innerHTML = "";

            tray.forEach((item, index) => {
                total += item.price * item.qty;
                count += item.qty;

                const drawerItem = document.createElement('div');
                drawerItem.className = 'drawer-item';
                drawerItem.innerHTML = `
                    <div>
                        <div style="font-weight:700; font-size:14px;">${item.name}</div>
                        <div style="font-size:12px; color:#64748b;">$${(item.price * item.qty).toFixed(2)}</div>
                    </div>
                    <div class="qty-picker">
                        <button class="minus-btn">-</button>
                        <span style="font-size:14px; font-weight:bold;">${item.qty}</span>
                        <button class="plus-btn">+</button>
                    </div>
                `;

                drawerItem.querySelector('.minus-btn').addEventListener('click', () => updateQty(index, -1));
                drawerItem.querySelector('.plus-btn').addEventListener('click', () => updateQty(index, 1));
                drawerList.appendChild(drawerItem);
            });

            document.getElementById("barBadge").innerText = count;
            document.getElementById("barTotal").innerText = "$" + total.toFixed(2);
            document.getElementById("drawerTotal").innerText = "$" + total.toFixed(2);
        }

        function toggleDrawer(open) {
            if (window.innerWidth >= 1024) return;
            const overlay = document.getElementById("drawerOverlay");
            if (open && tray.length > 0) overlay.classList.add("active");
            else overlay.classList.remove("active");
        }

        function handleOverlayClick(event) {
            if (window.innerWidth >= 1024) return;
            if (event.target.id === 'drawerOverlay') toggleDrawer(false);
        }

        function sendOrder() {
            if (tray.length === 0) {
                alert("يرجى إضافة منتجات إلى السلة أولاً!");
                return;
            }

            let table = document.getElementById("custTable").value.trim();
            let phone = document.getElementById("custPhone").value.trim();
            let address = document.getElementById("custAddress").value.trim();
            let note = document.getElementById("custNote").value.trim();

            if (currentOrderType === 'delivery') {
                if (!phone) {
                    alert("يرجى كتابة رقم الهاتف للتواصل عند اختيار التوصيل!");
                    document.getElementById("custPhone").focus();
                    return;
                }
                if (!address) {
                    alert("يرجى كتابة العنوان التفصيلي للتوصيل!");
                    document.getElementById("custAddress").focus();
                    return;
                }
            } else {
                if (!table) table = currentSessionId;
            }

            const btn = document.getElementById("sendOrderBtn");
            btn.disabled = true;
            btn.innerHTML = `<svg class="icon-svg spin" viewBox="0 0 24 24"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg> جاري الإرسال...`;

            const { ref, push } = window.dbRefs;
            let timeStr = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

            let newRequest = {
                id: currentSessionId,
                time: timeStr,
                type: currentOrderType === 'dine_in' ? 'داخل المحل' : 'توصيل / خارج المحل',
                table: currentOrderType === 'dine_in' ? table : `توصيل (${phone}) - ${address}`,
                phone: currentOrderType === 'delivery' ? phone : '',
                address: currentOrderType === 'delivery' ? address : '',
                note: note,
                items: [...tray],
                total: tray.reduce((sum, i) => sum + (i.price * i.qty), 0)
            };

            push(ref(window.db, 'requests'), newRequest)
                .then(() => {
                    sentOrders.unshift(newRequest);
                    localStorage.setItem("my_sent_orders", JSON.stringify(sentOrders));
                    renderSentOrders();

                    tray = [];
                    localStorage.removeItem("my_tray");
                    document.getElementById("custNote").value = "";
                    localStorage.removeItem("cust_note");

                    renderTray();
                    toggleDrawer(false);
                    alert(`تم إرسال الطلب (#${currentSessionId}) بنجاح! 🎉`);
                })
                .catch((err) => alert("خطأ في الإرسال: " + err.message))
                .finally(() => {
                    btn.disabled = false;
                    btn.innerHTML = `<svg class="icon-svg" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg> تأكيد وإرسال الطلب`;
                });
        }

        function renderSentOrders() {
            const containerMobile = document.getElementById("myOrdersContainerMobile");
            const containerDesktop = document.getElementById("myOrdersContainerDesktop");
            const listMobile = document.getElementById("sentOrdersListMobile");
            const listDesktop = document.getElementById("sentOrdersListDesktop");

            if (sentOrders.length === 0) {
                containerMobile.style.display = "none";
                containerDesktop.style.display = "none";
                return;
            }

            containerMobile.style.display = "block";
            containerDesktop.style.display = "block";
            
            let htmlContent = "";
            sentOrders.forEach(ord => {
                let itemsSummary = ord.items.map(i => `${i.name} (x${i.qty})`).join(' ، ');
                
                htmlContent += `
                    <div class="sent-card">
                        <div style="display:flex; justify-content:space-between; font-weight:700;">
                            <span>طلب #${ord.id} (${ord.time})</span>
                            <span style="color:var(--primary-amber);">$${ord.total.toFixed(2)}</span>
                        </div>
                        <div style="font-size:11.5px; color:var(--primary-amber); font-weight:bold; margin-top:2px;">${ord.table}</div>
                        <div style="color:#64748b; margin-top:4px;">${itemsSummary}</div>
                    </div>`;
            });

            listMobile.innerHTML = htmlContent;
            listDesktop.innerHTML = htmlContent;
        }

        function clearSentOrdersHistory() {
            if (confirm("هل تريد مسح سجل طلباتك من هذا الجهاز؟")) {
                sentOrders = [];
                localStorage.removeItem("my_sent_orders");
                renderSentOrders();
            }
        }

        window.onload = () => {
            initMenuFirebase();
            loadFromLocalStorage();
        };
    </script>
</body>

</html>
