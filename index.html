<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو المخبز - طلب جديد</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" rel="stylesheet">
    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ⚠️ يجب استخدام نفس إعدادات Firebase الخاصة بالمشروع
       const firebaseConfig = {
            apiKey: "AIzaSyAzA0XPVzn7dZYYKbqjoWD4XoH2MEHxq_s",
            authDomain: "pos-system-b20e2.firebaseapp.com",
            databaseURL: "https://pos-system-b20e2-default-rtdb.firebaseio.com",
            projectId: "pos-system-b20e2",
            storageBucket: "pos-system-b20e2.firebasestorage.app",
            messagingSenderId: "709615712934",
            appId: "1:709615712934:web:2a06fe3e6aa1630fe69267",
            measurementId: "G-9CFD4RBYH2"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.dbRefs = { ref, onValue, push };
    </script>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #f8fafc;
            color: #1e293b;
            padding: 16px;
            padding-bottom: 220px;
        }

        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 2px dashed #cbd5e1;
            margin-bottom: 20px;
        }

        .order-info {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .order-info input {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .card {
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card .emoji {
            font-size: 36px;
            margin-bottom: 6px;
        }

        .card .price {
            color: #2563eb;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .card button {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .tray {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f172a;
            color: white;
            padding: 16px;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
        }

        .tray-items {
            max-height: 100px;
            overflow-y: auto;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .tray-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 10px;
            border-radius: 6px;
        }

        .send-btn {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>🥖 منيو المخبز الإلكتروني</h1>
        <p>اختر وجبتك وأرسل الطلب مباشرة إلى الكاشير</p>
    </header>

    <div class="order-info">
        <input type="text" id="custTable" placeholder="رقم الطاولة أو اسم الزبون (مثال: طاولة 3)">
        <input type="text" id="custNote" placeholder="ملاحظات إضافية (مثال: بدون بصل)">
    </div>

    <div class="grid" id="menuGrid"></div>

    <div class="tray">
        <div class="tray-items" id="trayList"></div>
        <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:10px;">
            <span>الإجمالي:</span>
            <span id="trayTotal">$0.00</span>
        </div>
        <button class="send-btn" onclick="sendOrder()">🚀 إرسال الطلب للكاشير</button>
    </div>

    <script>
        let products = [];
        let tray = [];

        function initMenuFirebase() {
            if (!window.db) { setTimeout(initMenuFirebase, 100); return; }
            const { ref, onValue } = window.dbRefs;

            // جلب قائمة المنتجات المحدثة من Firebase مباشرة
            onValue(ref(window.db, 'products'), (snapshot) => {
                const data = snapshot.val();
                products = data ? Object.values(data) : [];
                renderMenu();
            });
        }

        function renderMenu() {
            const grid = document.getElementById("menuGrid");
            grid.innerHTML = "";
            products.forEach(p => {
                let safeName = encodeURIComponent(p.name);
                grid.innerHTML += `
                    <div class="card">
                        <div class="emoji">${p.emoji || '🥖'}</div>
                        <h3>${p.name}</h3>
                        <div class="price">$${Number(p.price || 0).toFixed(2)}</div>
                        <button onclick="addToTray('${safeName}')">+ إضافة</button>
                    </div>`;
            });
        }

        function addToTray(encodedName) {
            let name = decodeURIComponent(encodedName);
            let prod = products.find(p => p.name === name);
            if (!prod) return;

            let item = tray.find(i => i.name === name);
            if (item) {
                item.qty++;
            } else {
                tray.push({ name: prod.name, price: prod.price || 0, cost: prod.cost || 0, qty: 1 });
            }
            renderTray();
        }

        function renderTray() {
            const list = document.getElementById("trayList");
            list.innerHTML = "";
            let total = 0;

            tray.forEach((item) => {
                total += item.price * item.qty;
                list.innerHTML += `
                    <div class="tray-item">
                        <span>${item.name} (x${item.qty})</span>
                        <span>$${(item.price * item.qty).toFixed(2)}</span>
                    </div>`;
            });
            document.getElementById("trayTotal").innerText = "$" + total.toFixed(2);
        }

        function sendOrder() {
            let table = document.getElementById("custTable").value.trim() || "سفري / غير محدد";
            let note = document.getElementById("custNote").value.trim();

            if (tray.length === 0) return alert("الرجاء اختيار منتج واحد على الأقل!");

            const { ref, push } = window.dbRefs;

            let newRequest = {
                id: "REQ-" + Date.now().toString().slice(-4),
                time: new Date().toLocaleTimeString(),
                table: table,
                note: note,
                items: [...tray],
                total: tray.reduce((sum, i) => sum + (i.price * i.qty), 0)
            };

            // رفع الطلب إلى Firebase Realtime Database
            push(ref(window.db, 'requests'), newRequest)
                .then(() => {
                    tray = [];
                    document.getElementById("custNote").value = "";
                    renderTray();
                    alert("✅ تم إرسال طلبك بنجاح إلى الكاشير!");
                })
                .catch((err) => alert("خطأ في الإرسال: " + err.message));
        }

        window.onload = initMenuFirebase;
    </script>
</body>

</html>
